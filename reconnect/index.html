<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8ee">
  <title>Reconnect</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .hud {
      flex: 1;
      max-width: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: var(--wobbly);
      box-shadow: 3px 4px 0 rgba(36, 34, 31, 0.85);
      padding: 4px 10px;
      min-height: 44px;
      font-size: 1.25rem;
      white-space: nowrap;
    }
    .hud-time {
      font-variant-numeric: tabular-nums;
      min-width: 3ch;
      text-align: right;
    }
    .hud-score { font-variant-numeric: tabular-nums; }
    .hud-score.bump { animation: bump 0.25s ease-out; }
    @keyframes bump { 40% { transform: scale(1.3); } }
    .hud-time.low { color: var(--red); }
    .hud .stars.mini .star { width: 18px; height: 18px; }
    .grab-btn {
      position: absolute;
      left: 0;
      right: 0;
      margin: 0 auto;
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: min(64vw, 260px);
      min-height: 58px;
      font-size: 1.4rem;
      z-index: 5;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: #efece4;
      color: var(--pencil, #55534e);
    }
    .grab-btn.ready { background: #c2e8cc; color: var(--ink); }
    .grab-btn.holding { background: var(--yellow, #f4c430); color: var(--ink); }
    .grab-btn[hidden] { display: none; }
    @media (max-width: 360px) {
      .top-bar .paper-btn.small span { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-shell" id="shell">
    <canvas id="view" aria-label="Wiring floor"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
