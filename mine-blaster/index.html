<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8ee">
  <title>Mine Blaster</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .hud {
      flex: 1;
      max-width: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: var(--wobbly);
      box-shadow: 3px 4px 0 rgba(36, 34, 31, 0.85);
      padding: 4px 8px;
      min-height: 44px;
      font-size: 1.15rem;
      white-space: nowrap;
    }
    .hud-time, .hud-score { font-variant-numeric: tabular-nums; }
    .hud-time.low { color: var(--red); }
    .hud-score.bump { animation: bump 0.25s ease-out; }
    .hud-mult {
      font-size: 0.95rem;
      border: 2px solid var(--ink);
      border-radius: var(--wobbly-2);
      padding: 0 5px;
      background: #efece4;
      color: var(--pencil);
    }
    .hud-mult.on { background: var(--yellow); color: var(--ink); }
    @keyframes bump { 40% { transform: scale(1.3); } }
    .hud .stars.mini .star { width: 16px; height: 16px; }
    @media (max-width: 380px) {
      .top-bar .paper-btn.small span { display: none; }
      .hud .stars.mini { display: none; }
    }

    .controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(10px + env(safe-area-inset-bottom));
      margin: 0 auto;
      width: min(100% - 24px, 380px);
      display: flex;
      gap: 12px;
      z-index: 5;
    }
    .controls[hidden] { display: none; }
    .controls .paper-btn { min-height: 58px; touch-action: manipulation; }
    .reset-btn { flex: 0 0 auto; font-size: 1.1rem; }
    .reset-btn svg { width: 20px; height: 20px; }
    .lock-btn { flex: 1; font-size: 1.5rem; }
    .lock-btn:disabled { background: #efece4; color: var(--pencil); cursor: default; }
    .reset-btn:disabled { color: #aaa; cursor: default; }
  </style>
</head>
<body>
  <main class="game-shell" id="shell">
    <canvas id="view" aria-label="Mineshaft"></canvas>
    <div class="controls" id="controls" hidden>
      <button class="paper-btn reset-btn" id="reset" type="button" aria-label="Reset this shaft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 A8 8 0 1 0 7 5.8"/><path d="M3.5 3.5 L7 6 L4.5 9.5"/></svg>Reset</button>
      <button class="paper-btn primary lock-btn" id="lock" type="button">Lock</button>
    </div>
    <div class="overlay" id="overlay" hidden></div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
