<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8ee">
  <title>Bunker Clean-Up</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .hud {
      flex: 1;
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: var(--wobbly);
      box-shadow: 3px 4px 0 rgba(36, 34, 31, 0.85);
      padding: 4px 10px;
      min-height: 44px;
      font-size: 1.2rem;
    }
    .hud-time {
      min-width: 2ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .hud-time.urgent {
      color: var(--red);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      50% { transform: scale(1.18); }
    }
    .hud-pct {
      min-width: 3.2ch;
      font-variant-numeric: tabular-nums;
    }
    .hud-hits {
      display: flex;
      gap: 3px;
    }
    .hud-hits i {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--ink);
    }
    .hud-hits i.used {
      background: var(--red);
      animation: knock 0.4s ease-out;
    }
    @keyframes knock {
      40% { transform: scale(1.6); }
    }
    .meter {
      position: relative;
      flex: 1;
      height: 14px;
      border: 2px solid var(--ink);
      border-radius: var(--wobbly-2);
      background: var(--paper);
    }
    .meter .fill {
      height: 100%;
      width: 0;
      background: var(--blue);
      opacity: 0.55;
      border-radius: inherit;
      transition: width 0.2s;
    }
    .meter i {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -54%);
      font-style: normal;
      font-size: 1.05rem;
      color: #fff;
      -webkit-text-stroke: 1.5px var(--ink);
      line-height: 1;
    }
    .meter i.on {
      color: var(--yellow);
    }
    @media (max-width: 360px) {
      .top-bar .paper-btn.small span { display: none; }
    }
  </style>
</head>
<body>
  <main class="game-shell" id="shell">
    <canvas id="view" aria-label="Bunker map"></canvas>
    <div class="overlay" id="overlay" hidden></div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
