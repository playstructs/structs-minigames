<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8ee">
  <title>Machine Chemical Romance</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <style>
    .hud {
      flex: 1;
      max-width: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: var(--wobbly);
      box-shadow: 3px 4px 0 rgba(36, 34, 31, 0.85);
      padding: 4px 8px;
      min-height: 44px;
      font-size: 1.15rem;
      white-space: nowrap;
    }
    .hud-time, .hud-score { font-variant-numeric: tabular-nums; }
    .hud-time.low { color: var(--red); }
    .hud-score.bump { animation: bump 0.25s ease-out; }
    @keyframes bump { 40% { transform: scale(1.3); } }
    .hud .stars.mini .star { width: 16px; height: 16px; }
    @media (max-width: 380px) {
      .top-bar .paper-btn.small span { display: none; }
      .hud .stars.mini { display: none; }
    }

    /* Synthesizer panel: a sheet at the bottom; the machines stay visible above. */
    .synth {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0 auto;
      width: min(100%, 460px);
      background: #fff;
      border: 3px solid var(--ink);
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 0 rgba(36, 34, 31, 0.25);
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      z-index: 6;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .synth[hidden] { display: none; }
    .synth-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.3rem;
    }
    .synth-close {
      font: inherit;
      font-size: 1.1rem;
      width: 40px;
      height: 40px;
      border: 2px solid var(--ink);
      border-radius: var(--wobbly-2);
      background: #fff;
      cursor: pointer;
    }
    .synth-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .synth-label { font-size: 0.95rem; color: var(--pencil); min-width: 2.6em; }
    .chip {
      font: inherit;
      font-size: 1rem;
      flex: 1;
      min-height: 40px;
      border: 2px solid var(--ink);
      border-radius: var(--wobbly);
      background: #fff;
      cursor: pointer;
      padding: 2px 4px;
    }
    .chip.on { outline: 3px solid var(--ink); outline-offset: 1px; }
    .slots {
      flex: 1;
      display: flex;
      gap: 4px;
      min-height: 44px;
      align-items: center;
      padding: 2px 6px;
      border: 2px dashed var(--pencil);
      border-radius: 8px;
      background: #faf8f2;
    }
    .slots svg { width: 26px; height: 26px; flex-shrink: 1; min-width: 0; }
    .slots { min-width: 0; gap: 2px; }
    .slots .hint { color: var(--pencil); font-size: 0.95rem; }
    .key {
      font: inherit;
      flex: 1;
      min-height: 50px;
      border: 2px solid var(--ink);
      border-radius: var(--wobbly-2);
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 3px 0 rgba(36, 34, 31, 0.7);
      touch-action: manipulation;
    }
    .key:active { transform: translate(1px, 2px); box-shadow: 1px 1px 0 rgba(36, 34, 31, 0.7); }
    .key svg { width: 30px; height: 30px; }
    .key.clear { flex: 0 0 64px; font-size: 1rem; }
    .make { flex: 1; font-size: 1.2rem; min-height: 48px; }
    .queue { display: flex; gap: 6px; }
    .job {
      flex: 1;
      min-height: 64px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      padding: 3px 4px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      background: #faf8f2;
      position: relative;
      overflow: hidden;
    }
    .job.empty { border-style: dashed; color: #aaa; justify-content: center; }
    .job .sym { display: flex; gap: 1px; }
    .job .sym svg { width: 15px; height: 15px; }
    .job .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--yellow); }
    .job.ready { background: #fff3c4; cursor: pointer; }
    .job.ready.full { cursor: default; opacity: 0.75; }
  </style>
</head>
<body>
  <main class="game-shell" id="shell">
    <canvas id="view" aria-label="Refinery floor"></canvas>
    <section class="synth" id="synth" aria-label="Synthesizer" hidden>
      <div class="synth-head"><span>Synthesizer</span><button class="synth-close" id="synth-close" type="button" aria-label="Close synthesizer">✕</button></div>
      <div class="synth-row"><span class="synth-label">For</span><div class="synth-row" id="targets" style="flex:1"></div></div>
      <div class="synth-row"><span class="synth-label">Mix</span><div class="slots" id="slots"></div><button class="key clear" id="clear" type="button">Clear</button></div>
      <div class="synth-row" id="keys"></div>
      <div class="synth-row"><button class="paper-btn primary make" id="make" type="button">Synthesize</button></div>
      <div class="queue" id="queue"></div>
    </section>
    <div class="overlay" id="overlay" hidden></div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
